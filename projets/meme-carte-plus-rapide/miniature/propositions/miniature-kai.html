<!doctype html>
<!-- Miniatures « à la manière de Kai » de « Même carte, 2 fois plus rapide » (jeu. 19/11/2026), d'après la méthode du skill miniature-kai (15/11).
     Texte : TA CARTE / BRIDÉE ? (le titre dit le gain, la miniature dit le problème). Objet : la carte et un compteur de vitesse dont l'aiguille
     touche « 2× » (le chiffre de la fiche, à confirmer par les sources).
     ?v=h  Kai + visage : portrait à gauche, texte à droite, la carte et le compteur dessous
     ?v=i  couleurs de Technovore, sans visage : le texte sur une ligne en haut, la carte à gauche, le grand compteur à droite
     ?v=j  couleurs de Technovore + visage (couleurs de peau gardées), même scène que h
     Portrait : ?p=fry (défaut) ou ?p=dicaprio → ../sources/portrait-<p>-kai.png et -technovore.png, faits par ressources/miniatures/portrait.py.
     Page de 1280×720, rendue à ×3 par ../rendre.sh. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Archivo Black"; src:url(../../../../ressources/miniatures/fonts/archivo-black-latin-400.woff2) format("woff2"); }
  @font-face { font-family:"Anton"; src:url(../../../../ressources/miniatures/fonts/anton-latin-400.woff2) format("woff2"); }
  :root { --ink:#fff; --hl:#ffcc33; --echo:#ff3b30; --bg1:#1a1a1c; --bg2:#050505; --sh1:#ff3b30; --sh2:#2f6bff; --card:#ffcc33; }
  [data-v="i"], [data-v="j"] { --hl:#07c095; --echo:#0f1a24; --bg1:#3d566e; --bg2:#1a252f; --sh1:#ffffff; --sh2:#0f1a24; --card:#07c095; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; }
  body { position:relative; background:radial-gradient(ellipse 900px 600px at 50% 45%, var(--bg1) 0%, var(--bg2) 75%); color:var(--ink); }
  .grid { position:absolute; inset:0; opacity:.07;
    background-image:linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%); display:none; }
  [data-v="i"] .grid, [data-v="j"] .grid { display:block; }

  .t { position:absolute; white-space:nowrap; font-family:"Archivo Black", sans-serif; line-height:1; letter-spacing:-.02em; text-transform:uppercase; }
  .t.hl { color:var(--hl); }
  .t.echo { color:var(--echo); }

  .face { position:absolute; display:none; }
  [data-v="h"] .face.kai { display:block; left:-40px; top:70px; width:690px; }
  [data-v="j"] .face.tech { display:block; left:-40px; top:70px; width:690px; }

  .scene { position:absolute; inset:0; }
  .scene > * { display:none; }
  [data-v="h"] .duel, [data-v="i"] .duo, [data-v="j"] .solo { display:block; }
</style>
</head>
<body>
<div class="grid"></div>
<img class="face kai" id="fk" alt="">
<img class="face tech" id="ft" alt="">

<svg class="scene" viewBox="0 0 1280 720">
  <defs>
    <!-- tuile de logo : ombre décalée, fond, contour noir épais -->
    <g id="tq"><rect x="12" y="12" width="150" height="150" rx="10" fill="var(--sh1)"/><rect width="150" height="150" rx="10" fill="#fff" stroke="#000" stroke-width="7"/><image href="../sources/qwen-color.svg" x="28" y="28" width="94" height="94"/></g>
    <g id="tc"><rect x="12" y="12" width="150" height="150" rx="10" fill="var(--sh2)"/><rect width="150" height="150" rx="10" fill="#f4f1ea" stroke="#000" stroke-width="7"/><image href="../sources/claude.svg" x="30" y="30" width="90" height="90"/></g>
    <g id="fan"><circle r="60" fill="#fff" stroke="#000" stroke-width="6"/>
      <g fill="var(--card)" stroke="#000" stroke-width="4"><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(45)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(90)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(135)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(180)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(225)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(270)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(315)"/></g>
      <circle r="18" fill="#1a252f" stroke="#000" stroke-width="5"/></g>
    <!-- la carte : ombres décalées, équerre, corps, deux ventilateurs, étiquette 16 GO -->
    <g id="card">
      <rect x="20" y="20" width="420" height="190" rx="16" fill="var(--sh2)"/>
      <rect x="10" y="10" width="420" height="190" rx="16" fill="var(--sh1)"/>
      <rect x="-30" y="18" width="36" height="160" rx="4" fill="#c7c7cc" stroke="#000" stroke-width="6"/>
      <rect width="420" height="190" rx="16" fill="var(--card)" stroke="#000" stroke-width="7"/>
      <use href="#fan" x="120" y="92"/><use href="#fan" x="300" y="92"/>
      <rect x="70" y="190" width="240" height="13" fill="#000"/>
    </g>
    <!-- le compteur de vitesse : ombres décalées, cadran, trois zones, graduations, 1× et 2×, l'aiguille au bout -->
    <g id="gauge">
      <path d="M-200 0 A200 200 0 0 1 200 0 Z" fill="var(--sh2)" transform="translate(22 22)"/>
      <path d="M-200 0 A200 200 0 0 1 200 0 Z" fill="var(--sh1)" transform="translate(11 11)"/>
      <path d="M-200 0 A200 200 0 0 1 200 0 Z" fill="#fff" stroke="#000" stroke-width="8"/>
      <path d="M-122.0 -0.0 A122 122 0 0 1 -61.0 -105.7" fill="none" stroke="#c7c7cc" stroke-width="30"/><path d="M-61.0 -105.7 A122 122 0 0 1 61.0 -105.7" fill="none" stroke="var(--card)" stroke-width="30"/><path d="M61.0 -105.7 A122 122 0 0 1 121.9 -4.3" fill="none" stroke="#ff3b30" stroke-width="30"/>
      <line x1="-150.0" y1="-0.0" x2="-176.0" y2="-0.0" stroke="#000" stroke-width="7"/><line x1="-129.9" y1="-75.0" x2="-152.4" y2="-88.0" stroke="#000" stroke-width="7"/><line x1="-75.0" y1="-129.9" x2="-88.0" y2="-152.4" stroke="#000" stroke-width="7"/><line x1="0.0" y1="-150.0" x2="0.0" y2="-176.0" stroke="#000" stroke-width="7"/><line x1="75.0" y1="-129.9" x2="88.0" y2="-152.4" stroke="#000" stroke-width="7"/><line x1="129.9" y1="-75.0" x2="152.4" y2="-88.0" stroke="#000" stroke-width="7"/><line x1="150.0" y1="-0.0" x2="176.0" y2="-0.0" stroke="#000" stroke-width="7"/>
      <text x="-150" y="66" text-anchor="middle" font-family="Anton" font-size="60" fill="#fff" stroke="#000" stroke-width="8" paint-order="stroke">1×</text>
      <text x="150" y="66" text-anchor="middle" font-family="Anton" font-size="60" fill="var(--hl)" stroke="#000" stroke-width="8" paint-order="stroke">2×</text>
      <g transform="rotate(-12)"><path d="M0 -14 L170 0 L0 14 Z" fill="#000" stroke="#fff" stroke-width="4" transform="rotate(180) scale(-1 1)"/></g>
      <circle r="26" fill="#000" stroke="#fff" stroke-width="5"/>
    </g>
    <g id="tag"><rect x="5" y="5" width="150" height="64" rx="6" fill="var(--sh1)"/><rect width="150" height="64" rx="6" fill="#fff" stroke="#000" stroke-width="6"/><text x="75" y="51" text-anchor="middle" font-family="Anton" font-size="48" fill="#000">16 GO</text></g>
  </defs>

  <!-- h : la carte et le compteur, sous le texte à droite -->
  <g class="duel">
    <use href="#card" transform="translate(660 430) rotate(-5 210 95) scale(.78)"/>
    <use href="#gauge" transform="translate(1045 560) scale(.66)"/>
  </g>

  <!-- i : la carte à gauche, le grand compteur à droite -->
  <g class="duo">
    <use href="#card" transform="translate(110 340) rotate(-5 210 95)"/>
    <use href="#gauge" transform="translate(905 545) scale(1.02)"/>
  </g>

  <!-- j : comme h -->
  <g class="solo">
    <use href="#card" transform="translate(660 430) rotate(-5 210 95) scale(.78)"/>
    <use href="#gauge" transform="translate(1045 560) scale(.66)"/>
  </g>
</svg>

<div class="t" id="l1">TA CARTE</div>
<div class="t hl" id="l2">BRIDÉE ?</div>

<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'h';
  document.body.dataset.v = v;
  // ?p=fry|dicaprio : le portrait (sources/portrait-<p>-kai.png et -technovore.png, faits par portrait.py)
  const p = q.get('p') || 'fry'; document.body.dataset.p = p;
  fk.src = `../sources/portrait-${p}-kai.png`; ft.src = `../sources/portrait-${p}-technovore.png`;
  if (q.get('l1')) l1.textContent = q.get('l1');
  if (q.get('l2')) l2.textContent = q.get('l2');
  document.fonts.ready.then(() => {
    const place = (e, x, y, fs) => { e.style.fontSize = fs + 'px'; e.style.left = x + 'px'; e.style.top = y + 'px'; };
    const fit = (els, maxw, fs) => { els.forEach(e => e.style.fontSize = fs + 'px');
      const w = Math.max(...els.map(e => e.getBoundingClientRect().width)); return w > maxw ? fs * maxw / w : fs; };
    if (v === 'i') {                       // une seule ligne centrée en haut
      place(l1, 0, 52, 112); place(l2, 0, 52, 112);
      const gap0 = .28 * 112, w0 = l1.getBoundingClientRect().width + gap0 + l2.getBoundingClientRect().width;
      const fs = Math.min(112, 112 * 1180 / w0); l1.style.fontSize = l2.style.fontSize = fs + 'px';
      const gap = .28 * fs, w = l1.getBoundingClientRect().width + gap + l2.getBoundingClientRect().width, x0 = (1280 - w) / 2;
      l1.style.left = x0 + 'px'; l2.style.left = x0 + l1.getBoundingClientRect().width + gap + 'px';
    } else {                               // deux lignes à droite, alignées à gauche, jusqu'à x = 1240
      const fs = fit([l1, l2], 1240 - 640, 118);
      place(l1, 640, 110, fs); place(l2, 640, 110 + fs * 1.18, fs);
    }
    // comme chez Kai, seul le mot en couleur a sa copie décalée, posée dessous (un vrai élément .t, donc un calque dans le PSD)
    document.querySelectorAll('.t.hl').forEach(e => {
      const fs = parseFloat(e.style.fontSize), c = e.cloneNode(true);
      c.removeAttribute('id'); c.classList.remove('hl'); c.classList.add('echo');
      c.style.left = parseFloat(e.style.left) + .055 * fs + 'px'; c.style.top = parseFloat(e.style.top) + .055 * fs + 'px';
      e.before(c);
    });
  });
</script>
<script src="../../../../ressources/miniatures/export.js"></script>
</body>
</html>
