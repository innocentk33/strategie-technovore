<!doctype html>
<!-- Miniatures « à la manière de Kai » (14/11, demande de l'auteur), vidéo Strata du lun. 16/11/2026.
     Repris de Kai : fond sombre et calme, objets et visage cernés de blanc avec une ombre décalée, un mot en couleur avec sa copie décalée,
     tuiles de logos inclinées. Pas copié : ses scènes (patate, main, tête ouverte), sa signature.
     ?v=h  Kai + visage : The Rock « illustré » à gauche, TON PC / SUFFIT ? à droite, Qwen VS Claude dessous
     ?v=i  Kai aux couleurs de Technovore (ardoise #34495e, menthe #07c095), sans visage : TON PC SUFFIT ? en haut,
           la carte menthe avec l'autocollant Qwen « VS » la tuile Claude
     ?v=j  couleurs de Technovore + visage : le portrait en couleurs de peau, contour blanc et ombres menthe / ardoise, texte à droite, la carte et Qwen dessous
     Page de 1280×720, rendue à ×3 par ../rendre.sh (miniature-kai.html). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Archivo Black"; src:url(../../../../ressources/miniatures/fonts/archivo-black-latin-400.woff2) format("woff2"); }
  @font-face { font-family:"Anton"; src:url(../../../../ressources/miniatures/fonts/anton-latin-400.woff2) format("woff2"); }
  :root { --ink:#fff; --hl:#ffcc33; --echo:#ff3b30; --bg1:#1a1a1c; --bg2:#050505; --sh1:#ff3b30; --sh2:#2f6bff; --card:#ffcc33; }
  /* 15/11, ta demande : fond sombre et uni (plus de grille ni de dégradé), plus de contraste ; l'ombre décalée du mot passe en blanc (ton choix) */
  [data-v="i"], [data-v="j"] { --hl:#07c095; --echo:#ffffff; --bg1:#141e27; --bg2:#141e27; --sh1:#ffffff; --sh2:#34495e; --card:#07c095; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; }
  body { position:relative; background:radial-gradient(ellipse 900px 600px at 50% 45%, var(--bg1) 0%, var(--bg2) 75%); color:var(--ink); }
  .grid { position:absolute; inset:0; opacity:.07;
    background-image:linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%); display:none; }
  /* grille retirée le 15/11 */

  .t { position:absolute; white-space:nowrap; font-family:"Archivo Black", sans-serif; line-height:1; letter-spacing:-.02em; text-transform:uppercase; }
  .t.hl { color:var(--hl); }
  .t.echo { color:var(--echo); }

  .face { position:absolute; display:none; }
  [data-v="h"] .face.kai { display:block; left:-40px; top:70px; width:690px; }
  [data-v="j"] .face.tech { display:block; left:-40px; top:70px; width:690px; }

  .scene { position:absolute; inset:0; }
  .scene > * { display:none; }
  [data-v="h"] .duel, [data-v="i"] .duo, [data-v="j"] .solo { display:block; }
</style>
</head>
<body>
<div class="grid"></div>
<img class="face kai" src="../sources/portrait-kai.png" alt="">
<img class="face tech" src="../sources/portrait-technovore.png" alt="">

<svg class="scene" viewBox="0 0 1280 720">
  <defs>
    <!-- tuile de logo : ombre décalée, fond, contour noir épais -->
    <g id="tq"><rect x="12" y="12" width="150" height="150" rx="10" fill="var(--sh1)"/><rect width="150" height="150" rx="10" fill="#fff" stroke="#000" stroke-width="7"/><image href="../sources/qwen-color.svg" x="28" y="28" width="94" height="94"/></g>
    <g id="tc"><rect x="12" y="12" width="150" height="150" rx="10" fill="var(--sh2)"/><rect width="150" height="150" rx="10" fill="#f4f1ea" stroke="#000" stroke-width="7"/><image href="../sources/claude.svg" x="30" y="30" width="90" height="90"/></g>
    <g id="fan"><circle r="60" fill="#fff" stroke="#000" stroke-width="6"/>
      <g fill="var(--card)" stroke="#000" stroke-width="4"><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(45)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(90)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(135)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(180)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(225)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(270)"/><path d="M0 0 L-11 -53 A53 53 0 0 1 11 -53 Z" transform="rotate(315)"/></g>
      <circle r="18" fill="#1a252f" stroke="#000" stroke-width="5"/></g>
    <!-- la carte : ombres décalées, équerre, corps, deux ventilateurs, étiquette 16 GO -->
    <g id="card">
      <rect x="20" y="20" width="420" height="190" rx="16" fill="var(--sh2)"/>
      <rect x="10" y="10" width="420" height="190" rx="16" fill="var(--sh1)"/>
      <rect x="-30" y="18" width="36" height="160" rx="4" fill="#c7c7cc" stroke="#000" stroke-width="6"/>
      <rect width="420" height="190" rx="16" fill="var(--card)" stroke="#000" stroke-width="7"/>
      <use href="#fan" x="120" y="92"/><use href="#fan" x="300" y="92"/>
      <rect x="70" y="190" width="240" height="13" fill="#000"/>
    </g>
    <g id="tag"><rect x="5" y="5" width="150" height="64" rx="6" fill="var(--sh1)"/><rect width="150" height="64" rx="6" fill="#fff" stroke="#000" stroke-width="6"/><text x="75" y="51" text-anchor="middle" font-family="Anton" font-size="48" fill="#000">16 GO</text></g>
  </defs>

  <!-- h : Qwen VS Claude sous le texte, à droite -->
  <g class="duel">
    <use href="#tq" transform="translate(720 420) rotate(-8 75 75)"/>
    <text x="948" y="540" text-anchor="middle" font-family="Archivo Black" font-size="64" fill="var(--echo)">VS</text>
    <text x="943" y="535" text-anchor="middle" font-family="Archivo Black" font-size="64" fill="var(--hl)">VS</text>
    <use href="#tc" transform="translate(1030 414) rotate(7 75 75)"/>
  </g>

  <!-- i : la carte avec l'autocollant Qwen, VS, la tuile Claude -->
  <g class="duo">
    <use href="#card" transform="translate(150 330) rotate(-5 210 95)"/>
    <use href="#tq" transform="translate(90 250) rotate(-12 75 75) scale(.92)"/>
    <use href="#tag" transform="translate(470 300) rotate(9)"/>
    <text x="772" y="520" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="var(--echo)">VS</text>
    <text x="765" y="513" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="var(--hl)">VS</text>
    <use href="#tc" transform="translate(880 330) rotate(7 75 75) scale(1.25)"/>
  </g>

  <!-- j : la carte et l'autocollant Qwen sous le texte, à droite -->
  <g class="solo">
    <use href="#card" transform="translate(740 410) rotate(-5 210 95) scale(.86)"/>
    <use href="#tq" transform="translate(676 372) rotate(-12 75 75) scale(.8)"/>
    <use href="#tag" transform="translate(1020 386) rotate(9) scale(.85)"/>
  </g>
</svg>

<div class="t" id="l1">TON PC</div>
<div class="t hl" id="l2">SUFFIT ?</div>

<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'h';
  document.body.dataset.v = v;
  if (q.get('l1')) l1.textContent = q.get('l1');
  if (q.get('l2')) l2.textContent = q.get('l2');
  document.fonts.ready.then(() => {
    const place = (e, x, y, fs) => { e.style.fontSize = fs + 'px'; e.style.left = x + 'px'; e.style.top = y + 'px'; };
    if (v === 'i') {                       // une seule ligne centrée en haut
      const fs = 112; place(l1, 0, 52, fs); place(l2, 0, 52, fs);
      const gap = .28 * fs, w = l1.getBoundingClientRect().width + gap + l2.getBoundingClientRect().width, x0 = (1280 - w) / 2;
      l1.style.left = x0 + 'px'; l2.style.left = x0 + l1.getBoundingClientRect().width + gap + 'px';
    } else {                               // deux lignes à droite, alignées à gauche
      place(l1, 660, 110, 118); place(l2, 660, 250, 118);
    }
    // comme chez Kai, seul le mot en couleur a sa copie décalée, posée dessous (un vrai élément .t, donc un calque dans le PSD)
    document.querySelectorAll('.t.hl').forEach(e => {
      const fs = parseFloat(e.style.fontSize), c = e.cloneNode(true);
      c.removeAttribute('id'); c.classList.remove('hl'); c.classList.add('echo');
      c.style.left = parseFloat(e.style.left) + .055 * fs + 'px'; c.style.top = parseFloat(e.style.top) + .055 * fs + 'px';
      e.before(c);
    });
  });
</script>
<script src="../../../../ressources/miniatures/export.js"></script>
</body>
</html>
