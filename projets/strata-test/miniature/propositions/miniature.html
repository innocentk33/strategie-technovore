<!doctype html>
<!-- Miniatures v2 « grand public » (11/11) de la vidéo Strata du lun. 16/11/2026, style OpenCode piraté (règle du 11/11).
     La v1 (« MA 5080 », avec la carte Inno3D de l'auteur) est dans miniature-v1.html et ../rendus/v1/.
     ?v=a  TON PC / VS CLAUDE ?      (test A/B : seule la ligne rouge change)
     ?v=b  TON PC / AU NIVEAU ?
     ?v=c  gabarit d'après les tests : la ligne rouge et le badge se remplissent par l'URL ou par les constantes plus bas,
           ex. miniature.html?v=c&rouge=A%20TENU&toks=72   (sans paramètre : ⟦verdict⟧ et ⟦tok/s⟧ restent visibles, à ne pas publier)
     Page de 1280×720, rendue à ×3 par ../rendre.sh. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Inter"; src:url(../../../../ressources/miniatures/fonts/inter-latin-wght.woff2) format("woff2"); font-weight:100 900; }
  @font-face { font-family:"JetBrains Mono"; src:url(../../../../ressources/miniatures/fonts/jetbrains-mono-latin-700.woff2) format("woff2"); font-weight:700; }
  :root { --ink:#f5f5f7; --red:#ff3b30; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; background:#050505; }
  body { position:relative; font-family:"Inter", sans-serif; color:var(--ink); }

  /* Fond : du « code » très sombre (lignes de journal de Strata inventées, illisibles en petit), comme la référence OpenCode */
  .code { position:absolute; inset:-10px; font:700 15px/21px "JetBrains Mono", monospace; color:#9a9a9a; white-space:pre;
    -webkit-mask-image:radial-gradient(ellipse 900px 620px at 30% 40%, #000 30%, rgba(0,0,0,.35) 100%); }
  .halo2 { position:absolute; left:-260px; top:-120px; width:1100px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(255,59,48,.10) 0%, transparent 62%); }
  .halo { position:absolute; left:640px; top:-160px; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,59,48,.30) 0%, rgba(255,59,48,.10) 38%, transparent 66%); }
  .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 35% 45%, transparent 45%, rgba(0,0,0,.7) 100%); }

  /* L'objet : une carte graphique sans marque (16 Go) et une barrette de RAM (32 Go), dessinées, petites, au-dessus du texte.
     La RAM est là exprès : la vidéo dit qu'il faut au moins 32 Go de RAM, la carte seule ne suffit pas. */
  .kit { position:absolute; left:56px; top:40px; filter:drop-shadow(0 10px 22px rgba(0,0,0,.9)) drop-shadow(0 0 16px rgba(255,255,255,.08)); }
  .toks { position:absolute; left:420px; top:46px; padding:4px 16px; border-radius:12px; background:#1c1c1e; border:2px solid #3a3a3c;
    font:700 40px "JetBrains Mono", monospace; letter-spacing:-.04em; color:var(--ink); display:none; }
  [data-v="c"] .toks.on { display:block; }

  /* Les 2 lignes : Inter 900 en capitales, blanc puis rouge */
  .t { position:absolute; left:54px; white-space:nowrap; font-weight:900; letter-spacing:-.035em; line-height:1; text-transform:uppercase;
    text-shadow:0 6px 26px rgba(0,0,0,.95); }
  .l1 { top:140px; font-size:128px; }
  .l2 { top:252px; font-size:116px; color:var(--red); }

  /* Le meme : Dwayne Johnson, le sourcil levé (« The People's Eyebrow »), détouré d'une vidéo sur fond vert, retourné en miroir pour qu'il se tourne vers le texte */
  .rock { position:absolute; left:720px; top:58px; width:714px; height:688px; transform:scaleX(-1);
    background:url(../sources/the-rock-sourcil-detoure.png) no-repeat 0 0 / 100% 100%;
    filter:drop-shadow(0 0 2px rgba(255,90,80,.9)) drop-shadow(0 0 26px rgba(255,59,48,.45)) contrast(1.05) saturate(.8); }

  /* Texte « PEAK » (?txt=peak, test A/B du 12/11 contre l'ancien texte) : lettres blanches serrées, copie rouge un peu plus grande décalée vers le bas, sans flou */
  @font-face { font-family:"Anton"; src:url(../../../../ressources/miniatures/fonts/anton-latin-400.woff2) format("woff2"); }
  [data-txt="peak"] .t { font-family:"Anton", sans-serif; font-weight:400; color:#fff; letter-spacing:-.025em; text-shadow:none; }
  /* La copie rouge est un vrai élément .t (calque de texte dans le PSD), créé par le script : ×1,06, centrée, 0,075 em plus bas */
  [data-txt="peak"] .t.echo { color:var(--red); }
  [data-txt="peak"] .l1 { top:138px; font-size:200px; }
  [data-txt="peak"] .l2 { top:340px; font-size:164px; color:#fff; }
</style>
</head>
<body>
<div class="code" id="code"></div>
<div class="halo2"></div>
<div class="halo"></div>
<div class="vignette"></div>
<div class="rock"></div>
<svg class="kit" width="340" height="88" viewBox="0 0 400 104" font-family="Inter" font-weight="900">
  <!-- carte : équerre, corps, deux ventilateurs, pastille 16 GO -->
  <rect x="0" y="6" width="12" height="92" rx="2" fill="#8e8e93"/>
  <rect x="12" y="4" width="236" height="96" rx="14" fill="#2c2c2e" stroke="#636366" stroke-width="3"/>
  <g fill="#1c1c1e" stroke="#48484a" stroke-width="3"><circle cx="66" cy="52" r="38"/><circle cx="194" cy="52" r="38"/></g>
  <g fill="#48484a"><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(0.0 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(51.4 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(102.9 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(154.3 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(205.7 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(257.1 66 52)"/><path d="M66 52 C52 38 60 20 74 16 C68 28 70 40 66 52Z" transform="rotate(308.6 66 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(0.0 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(51.4 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(102.9 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(154.3 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(205.7 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(257.1 194 52)"/><path d="M194 52 C180 38 188 20 202 16 C196 28 198 40 194 52Z" transform="rotate(308.6 194 52)"/></g>
  <g fill="#3a3a3c"><circle cx="66" cy="52" r="10"/><circle cx="194" cy="52" r="10"/></g>
  <rect x="96" y="34" width="68" height="36" rx="8" fill="#f5f5f7"/>
  <text x="130" y="60" text-anchor="middle" font-size="22" fill="#000" letter-spacing="-.5">16 GO</text>
  <rect x="40" y="99" width="150" height="5" fill="#c9a227"/>
  <!-- barrette de RAM : circuit, puces, contacts, pastille 32 GO -->
  <g transform="translate(270 22)">
    <rect x="0" y="0" width="126" height="58" rx="5" fill="#2c2c2e" stroke="#636366" stroke-width="3"/>
    <g fill="#111"><rect x="8" y="8" width="20" height="22" rx="2"/><rect x="98" y="8" width="20" height="22" rx="2"/></g>
    <rect x="31" y="8" width="64" height="30" rx="7" fill="#f5f5f7"/>
    <text x="63" y="31" text-anchor="middle" font-size="20" fill="#000" letter-spacing="-.5">32 GO</text>
    <rect x="6" y="58" width="114" height="8" fill="#c9a227"/>
  </g>
</svg>
<div class="toks" id="toks"></div>
<div class="t l1">TON PC</div>
<div class="t l2" id="rouge"></div>

<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'a';
  document.body.dataset.v = v;
  // ⟦ À REMPLIR APRÈS LES TESTS (variante c) ⟧ : ou bien passe ?rouge=…&toks=… dans l'URL
  const VERDICT = q.get('rouge') || '⟦verdict⟧';   // 1 à 2 mots, 10 caractères au plus (ex. « A GAGNÉ », « PAS LOIN »)
  const TOKS    = q.has('toks') ? q.get('toks') : '⟦tok/s⟧';     // le tok/s typique du jeu (R1), sans unité ; ?toks= vide = pas de badge.
                                                   // Mesuré sur la 5080 : le badge le dit, pour ne pas le promettre à toutes les cartes de 16 Go.
  const rouge = { a:'VS CLAUDE ?', b:'AU NIVEAU ?', c:VERDICT }[v];
  document.getElementById('rouge').textContent = rouge;
  if (v === 'c' && TOKS) { const t = document.getElementById('toks'); t.textContent = TOKS + ' tok/s · 5080'; t.classList.add('on'); }

  // Fond de code déterministe
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const words = ['strata','launch','--resident-experts','tok/s','experts','layer','ctx','65536','prefill','decode','0x3f','vram','ram','ssd','mtp','iq1_m','coder','ok','load','gpu','{','}','=>','[',']','/v1/messages','200','::'];
  const rows = [];
  for (let r = 0; r < 36; r++) {
    let line = '';
    while (line.length < 150) line += rnd() < .22 ? ' '.repeat(1 + Math.floor(rnd() * 6)) : words[Math.floor(rnd() * words.length)] + ' ';
    rows.push(line);
  }
  document.getElementById('code').innerHTML = rows.map(l => l.split(' ').map(w => w ? `<span style="opacity:${(.025 + rnd() * .075).toFixed(2)}">${w}</span>` : '').join(' ')).join('\n');
</script>
<script>
  // Texte « PEAK » (?txt=peak) : une copie rouge de chaque ligne, posée juste avant elle (donc dessous), avant que export.js lise les calques
  document.body.dataset.txt = new URLSearchParams(location.search).get('txt') || '';
  if (document.body.dataset.txt === 'peak') document.fonts.ready.then(() => {
    document.querySelectorAll('.t').forEach(e => {
      const fs = parseFloat(getComputedStyle(e).fontSize), w = e.getBoundingClientRect().width, c = e.cloneNode(true);
      c.removeAttribute('id'); c.classList.add('echo');
      c.style.fontSize = fs * 1.06 + 'px';
      c.style.left = e.offsetLeft - .03 * w + 'px';
      c.style.top = e.offsetTop + .075 * fs + 'px';
      e.before(c);
    });
  });
</script>
<script src="../../../../ressources/miniatures/export.js"></script>
</body>
</html>
