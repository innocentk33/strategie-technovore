<!doctype html>
<!-- Miniatures « Pourquoi avoir ta propre IA » (v3, 26/10). Variante via ?v=a|b|c|d|e|f.
     Décors photo générés par vidIQ (decors/*.png, 1280×720, sans texte) ; textes, logos et effets ajoutés ici.
     Hors charte à ta demande : ni ardoise, ni menthe. Les textes .t deviennent des calques de texte (psd.py). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Anton"; src:url(../../../../ressources/miniatures/fonts/anton-latin-400.woff2) format("woff2"); }
  @font-face { font-family:"Archivo Black"; src:url(../../../../ressources/miniatures/fonts/archivo-black-latin-400.woff2) format("woff2"); }
  @font-face { font-family:"Inter"; src:url(../../../../ressources/miniatures/fonts/inter-latin-wght.woff2) format("woff2"); font-weight:100 900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; background:#000; }
  body { position:relative; font-family:"Inter", sans-serif; }
  .only { display:none; }
  [data-v="a"] .a, [data-v="b"] .b, [data-v="c"] .c, [data-v="d"] .d, [data-v="e"] .e, [data-v="f"] .f { display:block; }
  .plate { position:absolute; inset:0; background:no-repeat center / cover; }
  .abs { position:absolute; }
  svg.logo { position:absolute; display:block; }
  .t { position:absolute; white-space:nowrap; }
  .big { font-family:"Anton", sans-serif; font-weight:400; line-height:.98; letter-spacing:.005em; text-transform:uppercase; }
  .ctx { font-weight:800; font-size:40px; letter-spacing:-.01em; }

  /* A · le panneau d'interdiction : ChatGPT barré (disque blanc mesuré : centre 358,326, rayon 180) */
  .a.plate { background-image:url(decors/panneau.png); }
  .a.shade { position:absolute; inset:0; background:linear-gradient(90deg, transparent 55%, rgba(0,0,0,.28) 100%); }
  .a.disc { position:absolute; left:178px; top:146px; width:361px; height:361px; border-radius:50%; overflow:hidden; }
  .a.disc .slash { position:absolute; left:-40px; top:146px; width:441px; height:70px; transform:rotate(45deg);
    background:linear-gradient(180deg, #d0101c 0%, #b4000c 55%, #8f0008 100%); box-shadow:0 0 0 2px rgba(120,0,0,.25), 0 8px 18px rgba(0,0,0,.35); }
  .a.disc .gloss { position:absolute; inset:0; background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.0) 40%, rgba(0,0,0,.10) 100%); }
  .a.t1 { left:690px; top:44px; font-size:154px; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.85); }
  .q { color:#ff2a2a; }

  /* B · le bouton d'arrêt d'urgence, ChatGPT sur le champignon */
  .b.plate { background-image:url(decors/bouton.png); filter:brightness(1.18) saturate(1.1); }
  .b.shade { position:absolute; inset:0; background:radial-gradient(ellipse 46% 60% at 82% 30%, rgba(255,40,30,.22), transparent 70%); }
  .b.cap { position:absolute; left:348px; top:152px; width:170px; height:170px; transform:rotate(-14deg) scaleY(.5); transform-origin:50% 50%; }
  .b.cap svg { width:170px; height:170px; filter:drop-shadow(0 2px 0 rgba(90,0,0,.55)); }
  .b.t1 { left:650px; top:62px; font-size:134px; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.9); }

  /* C · le dinosaure du jeu hors ligne de Chrome, qui parle */
  .c.vig { position:absolute; inset:0; background:radial-gradient(ellipse 75% 85% at 42% 52%, transparent 45%, rgba(30,45,60,.30) 100%); }
  .c.plate { background-image:url(decors/dino.png); background-color:#e9edee; background-size:auto 86%; background-position:-120px bottom; }
  .c.bubble { position:absolute; left:566px; top:214px; width:330px; height:150px; border-radius:75px 75px 75px 16px;
    background:linear-gradient(135deg, #2f7bff, #6a3cff); box-shadow:0 18px 40px rgba(60,40,200,.35); }
  .c.bubble i { position:absolute; top:53px; width:44px; height:44px; border-radius:50%; background:#fff; }
  .c.t1 { left:44px; top:74px; font-family:"Archivo Black", sans-serif; font-size:104px; line-height:.96; color:#202124; letter-spacing:-.02em; text-transform:uppercase; }
  .c.ctx { left:50px; top:28px; color:#70757a; }

  /* D · l'IA en boîte, comme un jouet (boîte : x 210-580 ; bande jaune du bas : y 548-606) */
  .d.plate { background-image:url(decors/boite.png); }
  .d.label { left:236px; top:131px; font-family:"Archivo Black", sans-serif; font-size:58px; color:#fff; letter-spacing:.02em; text-shadow:0 3px 0 #0b2a8a; }
  .d.model { left:270px; top:552px; font-family:"Archivo Black", sans-serif; font-size:40px; color:#1438b8; letter-spacing:.01em; }
  .d.sticker { position:absolute; left:478px; top:300px; width:196px; height:196px; transform:rotate(-12deg); filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .d.sticker .burst { position:absolute; inset:0; background:#ff2a3a;
    clip-path:polygon(50% 0%,59% 12%,73% 5%,76% 20%,91% 18%,87% 33%,100% 40%,90% 52%,99% 64%,85% 69%,87% 84%,72% 83%,66% 97%,54% 89%,43% 99%,36% 86%,21% 91%,20% 76%,5% 73%,12% 60%,0% 50%,11% 40%,3% 27%,17% 23%,16% 8%,31% 11%,39% 0%); }
  .d.sticker span { position:absolute; left:0; right:0; top:52px; text-align:center; font-family:"Archivo Black", sans-serif; font-size:22px; line-height:1.08; color:#fff; }
  .d.t1 { left:700px; top:42px; font-size:152px; color:#ffd400; text-shadow:0 6px 30px rgba(0,0,0,.8); }

  /* E · le coffre-fort */
  .e.plate { background-image:url(decors/coffre.png); }
  .e.ctx { left:744px; top:28px; color:#8fd8e0; font-size:48px; }
  .e.t1 { left:740px; top:84px; font-size:142px; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.9), 0 0 40px rgba(80,230,255,.35); }

  /* F · la cocotte : une IA faite maison */
  .f.plate { background-image:url(decors/cocotte.png); }
  .f.spark { position:absolute; filter:drop-shadow(0 0 18px rgba(255,214,140,.95)) drop-shadow(0 0 50px rgba(255,170,60,.7)); }
  .f.ctx { left:742px; top:34px; font-family:"Anton", sans-serif; font-weight:400; font-size:84px; line-height:1; color:#ffae42; text-transform:uppercase; text-shadow:0 6px 24px rgba(0,0,0,.8), 0 0 40px rgba(255,150,40,.45); }
  .f.t1 { left:740px; top:120px; font-size:124px; color:#fff4e2; text-shadow:0 6px 30px rgba(0,0,0,.85), 0 0 50px rgba(255,170,60,.35); }
</style>
</head>
<body>
<!-- A -->
<div class="a only plate"></div>
<div class="a only shade"></div>
<svg class="a only logo" viewBox="0 0 24 24" style="left:243px;top:211px;width:230px;height:230px"><path id="oa" fill="#111"/></svg>
<div class="a only disc"><div class="slash"></div><div class="gloss"></div></div>
<div class="a only t big t1">plus<br>besoin <span class="q">?</span></div>

<!-- B -->
<div class="b only plate"></div>
<div class="b only shade"></div>
<div class="b only cap"><svg viewBox="0 0 24 24"><path class="oa" fill="#fff6f4"/></svg></div>
<div class="b only t big t1">et s'ils<br>appuient <span class="q">?</span></div>

<!-- C -->
<div class="c only plate"></div>
<div class="c only vig"></div>
<div class="c only bubble"><i style="left:76px"></i><i style="left:143px"></i><i style="left:210px"></i></div>
<div class="c only t ctx">aucune connexion,</div>
<div class="c only t t1">et il parle.</div>

<!-- D -->
<div class="d only plate"></div>
<div class="d only t label">TON IA</div>
<div class="d only t model">GEMMA 4</div>
<div class="d only sticker"><div class="burst"></div><span>INTERNET<br>NON<br>INCLUS</span></div>
<div class="d only t big t1">tu la<br>veux <span style="color:#fff">?</span></div>

<!-- E -->
<div class="e only plate"></div>
<div class="e only t ctx">tes données :</div>
<div class="e only t big t1">rien ne<br>sort.</div>

<!-- F -->
<div class="f only plate"></div>
<svg class="f only spark" viewBox="0 0 100 100" style="left:300px;top:40px;width:120px;height:120px"><path d="M50 0C53 30 70 47 100 50C70 53 53 70 50 100C47 70 30 53 0 50C30 47 47 30 50 0Z" fill="#fff7e6"/></svg>
<svg class="f only spark" viewBox="0 0 100 100" style="left:430px;top:120px;width:56px;height:56px"><path d="M50 0C53 30 70 47 100 50C70 53 53 70 50 100C47 70 30 53 0 50C30 47 47 30 50 0Z" fill="#fff7e6"/></svg>
<svg class="f only spark" viewBox="0 0 100 100" style="left:250px;top:150px;width:40px;height:40px"><path d="M50 0C53 30 70 47 100 50C70 53 53 70 50 100C47 70 30 53 0 50C30 47 47 30 50 0Z" fill="#fff7e6"/></svg>
<div class="f only t ctx">mon IA,</div>
<div class="f only t big t1">faite<br>maison.</div>

<script src="../../../../ressources/miniatures/logos/logos.js"></script>
<script>
  document.body.dataset.v = new URLSearchParams(location.search).get('v') || 'a';
  document.querySelectorAll('#oa, .oa').forEach(p => p.setAttribute('d', LOGO.openai));
</script>
<script src="../../../../ressources/miniatures/export.js"></script>
</body>
</html>
